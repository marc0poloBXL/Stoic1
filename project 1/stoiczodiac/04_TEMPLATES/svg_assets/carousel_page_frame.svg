<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="marble">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feBlend in="faded" in2="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" filter="url(#marble)"/>

  <!-- Full gold border - visible for carousel slides -->
  <rect x="20" y="20" width="1040" height="1040" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Inner border -->
  <rect x="30" y="30" width="1020" height="1020" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>

  <!-- Top header bar (for page title section) -->
  <rect x="100" y="45" width="880" height="1" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Bottom footer area line (for page numbers) -->
  <rect x="100" y="1034" width="880" height="1" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Corner ornaments -->
  <path d="M 36 46 L 36 36 L 46 36" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 1044 46 L 1044 36 L 1034 36" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 36 1034 L 36 1044 L 46 1044" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 1044 1034 L 1044 1044 L 1034 1044" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Page number placeholder circle - bottom center -->
  <circle cx="540" cy="1055" r="6" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>

  <!-- Content safe zone -->
  <rect x="120" y="120" width="840" height="840" fill="none" stroke="none"/>
</svg>