<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="marble">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feBlend in="faded" in2="SourceGraphic" mode="overlay"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" filter="url(#marble)"/>

  <!-- Outer gold border -->
  <rect x="30" y="30" width="1020" height="1020" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>

  <!-- Top accent line -->
  <rect x="240" y="60" width="600" height="1.5" fill="url(#goldGrad)" opacity="0.5"/>
  <rect x="240" y="1018" width="600" height="1.5" fill="url(#goldGrad)" opacity="0.5"/>

  <!-- Corner ornaments -->
  <path d="M 46 60 L 46 46 L 60 46" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 1034 60 L 1034 46 L 1020 46" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 46 1020 L 46 1034 L 60 1034" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 1034 1020 L 1034 1034 L 1020 1034" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Diamond accent -->
  <polygon points="540,975 545,980 540,985 535,980" fill="#D4AF37" opacity="0.35"/>

  <!-- ========== FINISHED CONTENT ========== -->

  <!-- Stoic Wisdom badge (top-center) -->
  <rect x="330" y="100" width="420" height="44" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <text x="540" y="127" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#D4AF37" text-anchor="middle" opacity="0.85">STOIC WISDOM</text>

  <!-- Sign badge — top-right -->
  <text x="940" y="190" font-family="serif" font-size="56" fill="#E63946" text-anchor="end" opacity="0.9">♈</text>
  <text x="940" y="220" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" fill="#E63946" text-anchor="end" letter-spacing="3" opacity="0.7">ARIES</text>
  <text x="940" y="240" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="11" fill="#E63946" text-anchor="end" letter-spacing="1" opacity="0.4">FIRE · MARS</text>

  <!-- Pill badge: theme -->
  <rect x="380" y="175" width="320" height="32" rx="16" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/>
  <text x="540" y="196" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#C9A96E" text-anchor="middle" opacity="0.6">CHANNELING IMPULSE INTO PURPOSE</text>

  <!-- Decorative line before quote -->
  <line x1="250" y1="310" x2="830" y2="310" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.2"/>

  <!-- Large quote mark (background) -->
  <text x="160" y="500" font-family="Georgia, serif" font-size="200" fill="url(#goldGrad)" opacity="0.06">"</text>

  <!-- MAIN QUOTE -->
  <text x="540" y="410" font-family="'Playfair Display', Georgia, serif" font-size="52" fill="#D4AF37" text-anchor="middle" filter="url(#textGlow)">"You have power over</text>
  <text x="540" y="480" font-family="'Playfair Display', Georgia, serif" font-size="52" fill="#D4AF37" text-anchor="middle" filter="url(#textGlow)">your mind — not</text>
  <text x="540" y="550" font-family="'Playfair Display', Georgia, serif" font-size="52" fill="#D4AF37" text-anchor="middle" filter="url(#textGlow)">outside events."</text>

  <!-- Attribution -->
  <line x1="400" y1="610" x2="680" y2="610" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
  <text x="540" y="650" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="24" font-style="italic" fill="#F5F5F5" text-anchor="middle" opacity="0.85">— Marcus Aurelius</text>

  <!-- Application line (bottom section) -->
  <line x1="200" y1="780" x2="880" y2="780" stroke="#C9A96E" stroke-width="0.5" opacity="0.15"/>

  <text x="540" y="820" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" opacity="0.6">Channel your fire. Let discipline direct your impulse.</text>

  <!-- Daily challenge pill -->
  <rect x="340" y="870" width="400" height="38" rx="19" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  <text x="540" y="895" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="1">TODAY: Pause before you act → Choose purpose.</text>

  <!-- CTA watermark -->
  <text x="540" y="1010" font-family="'Raleway', 'Helvetica Neue', sans-serif" font-size="12" fill="#F5F5F5" text-anchor="middle" opacity="0.3" letter-spacing="2">@STOICZODIAC</text>
</svg>