<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 5 — Instagram Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Raleway:wght@300;400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0A;
  --surface: #111111;
  --card-bg: #0D0D0D;
  --gold: #D4AF37;
  --gold-dim: rgba(212,175,55,0.12);
  --gold-glow: rgba(212,175,55,0.06);
  --text: #F5F5F5;
  --text-dim: rgba(245,245,245,0.45);
  --border: rgba(212,175,55,0.08);
}

:root[data-theme="light"] {
  --bg: #F5F0EB;
  --surface: #FFFFFF;
  --card-bg: #FAFAF7;
  --gold: #B8962E;
  --gold-dim: rgba(184,150,46,0.10);
  --gold-glow: rgba(184,150,46,0.04);
  --text: #1A1A1A;
  --text-dim: rgba(26,26,26,0.4);
  --border: rgba(184,150,46,0.10);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Raleway', Helvetica, Arial, sans-serif;
  min-height: 100vh;
}

/* Header */
.header {
  text-align: center;
  padding: 48px 24px 32px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}

.header h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2.6rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.04em;
}

.header .sub {
  font-size: 0.8rem;
  font-weight: 300;
  color: var(--text-dim);
  letter-spacing: 0.35em;
  text-transform: uppercase;
  margin-top: 8px;
}

.header .dates {
  margin-top: 6px;
  font-size: 0.85rem;
  color: var(--text-dim);
}

/* Feed grid — Instagram 3-column layout */
.feed {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  max-width: 1060px;
  margin: 0 auto;
  padding: 0 24px 64px;
}

/* Post card wrapper */
.post {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  transition: transform 0.2s;
}

.post:hover {
  transform: translateY(-3px);
}

/* Instagram-style square card (1080×1080 aspect) */
.card {
  position: relative;
  width: 100%;
  aspect-ratio: 1/1;
  background: var(--surface);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Sign color wash background */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 50%, var(--sign-glow) 0%, transparent 70%);
  opacity: 0.15;
}

/* Subtle top-right symbol watermark */
.card .watermark {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 1.6rem;
  opacity: 0.08;
  line-height: 1;
}

/* Decorative corner lines */
.card .corner-tl,
.card .corner-br {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: var(--gold);
  opacity: 0.35;
}
.card .corner-tl {
  top: 14px; left: 14px;
  border-top: 1px solid;
  border-left: 1px solid;
}
.card .corner-br {
  bottom: 14px; right: 14px;
  border-bottom: 1px solid;
  border-right: 1px solid;
}

/* Content */
.card-content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 32px;
  width: 100%;
}

/* Sign symbol */
.card .sign-symbol {
  font-size: 2rem;
  line-height: 1;
  margin-bottom: 4px;
  display: block;
}

/* Sign name */
.card .sign-name {
  font-family: 'Raleway', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 20px;
}

/* Gold divider */
.card .divider {
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 22px;
}

/* Theme label */
.card .theme-label {
  font-family: 'Raleway', sans-serif;
  font-size: 0.5rem;
  font-weight: 400;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}

/* The quote */
.card .quote {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text);
  font-style: italic;
  quotes: "“" "”" "‘" "’";
}

.card .quote::before { content: "“"; }
.card .quote::after { content: "”"; }

/* Attribution */
.card .attribution {
  font-family: 'Raleway', sans-serif;
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--gold);
  margin-top: 16px;
}

/* Challenge footer on card */
.card .challenge {
  position: absolute;
  bottom: 46px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Raleway', sans-serif;
  font-size: 0.5rem;
  font-weight: 400;
  color: var(--text-dim);
  letter-spacing: 0.02em;
  max-width: 80%;
  text-align: center;
  line-height: 1.4;
}

.card .challenge-label {
  display: block;
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--gold);
  margin-bottom: 2px;
  opacity: 0.6;
}

/* Post footer — caption preview */
.post-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}

.post-footer .handle {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 2px;
}

.post-footer .caption {
  font-size: 0.65rem;
  font-weight: 300;
  color: var(--text-dim);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.post-footer .hashtags {
  font-size: 0.6rem;
  color: var(--gold);
  opacity: 0.7;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Day label */
.post .day-label {
  font-size: 0.6rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  padding: 8px 14px 0;
  background: var(--card-bg);
}

.post .engagement {
  font-size: 0.55rem;
  font-weight: 300;
  color: var(--text-dim);
  opacity: 0.65;
  padding: 3px 14px 6px;
  background: var(--card-bg);
  letter-spacing: 0.02em;
}

/* Reel badge */
.reel-badge, .carousel-badge {
  position: absolute;
  bottom: 12px;
  right: 12px;
  font-size: 0.45rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 2px;
  z-index: 2;
}

.reel-badge {
  background: rgba(212,175,55,0.15);
  color: var(--gold);
  border: 1px solid rgba(212,175,55,0.25);
}

.carousel-badge {
  background: rgba(245,245,245,0.08);
  color: var(--text-dim);
  border: 1px solid var(--border);
}

/* Responsive */
@media (max-width: 800px) {
  .feed { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}

@media (max-width: 500px) {
  .feed { grid-template-columns: 1fr; max-width: 420px; gap: 20px; }
  .header h1 { font-size: 1.8rem; }
  .card .quote { font-size: 1rem; }
}
</style>
</head>
<body>
