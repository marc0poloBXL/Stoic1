<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .ring { fill: none; stroke: #D4AF37; stroke-width: 2.5; }
      .ring-thin { fill: none; stroke: #D4AF37; stroke-width: 1.2; opacity: 0.5; }
      .text-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; fill: #D4AF37; text-anchor: middle; letter-spacing: 3; }
      .text-sub { font-family: 'Raleway', Helvetica, sans-serif; font-size: 7px; fill: #F5F5F5; text-anchor: middle; letter-spacing: 2; opacity: 0.7; }
      .dot { fill: #D4AF37; opacity: 0.6; }
      .divider { stroke: #D4AF37; stroke-width: 0.5; opacity: 0.4; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="#0A0A0A" rx="8"/>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="160" class="ring"/>
  <circle cx="200" cy="200" r="155" class="ring-thin"/>
  <circle cx="200" cy="200" r="165" class="ring-thin"/>
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="80" class="ring"/>
  <circle cx="200" cy="200" r="75" class="ring-thin"/>
  <circle cx="200" cy="200" r="85" class="ring-thin"/>
  <!-- Decorative dots on outer ring -->
  <circle cx="200" cy="40" r="2" class="dot"/>
  <circle cx="200" cy="360" r="2" class="dot"/>
  <circle cx="40" cy="200" r="2" class="dot"/>
  <circle cx="360" cy="200" r="2" class="dot"/>
  <!-- Zodiac symbols around the outer ring -->
  <!-- Aries ♈ at top (0°) -->
  <text x="200" y="55" font-family="serif" font-size="16" fill="#E63946" text-anchor="middle">♈</text>
  <!-- Taurus ♉ (30°) -->
  <text x="294" y="96" font-family="serif" font-size="16" fill="#2A9D8F" text-anchor="middle">♉</text>
  <!-- Gemini ♊ (60°) -->
  <text x="352" y="175" font-family="serif" font-size="16" fill="#E9C46A" text-anchor="middle">♊</text>
  <!-- Cancer ♋ (90°) -->
  <text x="365" y="265" font-family="serif" font-size="16" fill="#A8DADC" text-anchor="middle">♋</text>
  <!-- Leo ♌ (120°) -->
  <text x="335" y="340" font-family="serif" font-size="16" fill="#F4A261" text-anchor="middle">♌</text>
  <!-- Virgo ♍ (150°) -->
  <text x="258" y="372" font-family="serif" font-size="16" fill="#8D6E63" text-anchor="middle">♍</text>
  <!-- Libra ♎ (180°) -->
  <text x="175" y="380" font-family="serif" font-size="16" fill="#457B9D" text-anchor="middle">♎</text>
  <!-- Scorpio ♏ (210°) -->
  <text x="88" y="345" font-family="serif" font-size="16" fill="#6C3483" text-anchor="middle">♏</text>
  <!-- Sagittarius ♐ (240°) -->
  <text x="42" y="270" font-family="serif" font-size="16" fill="#1D3557" text-anchor="middle">♐</text>
  <!-- Capricorn ♑ (270°) -->
  <text x="30" y="185" font-family="serif" font-size="16" fill="#1B4332" text-anchor="middle">♑</text>
  <!-- Aquarius ♒ (300°) -->
  <text x="68" y="100" font-family="serif" font-size="16" fill="#00B4D8" text-anchor="middle">♒</text>
  <!-- Pisces ♓ (330°) -->
  <text x="132" y="58" font-family="serif" font-size="16" fill="#80CED7" text-anchor="middle">♓</text>
  <!-- Center text -->
  <!-- Horizontal divider -->
  <line x1="145" y1="180" x2="255" y2="180" class="divider"/>
  <text x="200" y="173" class="text-title">STOIC</text>
  <text x="200" y="198" class="text-title">WISDOM</text>
  <line x1="145" y1="208" x2="255" y2="208" class="divider"/>
  <text x="200" y="228" class="text-sub">— ZODIAC SIGNS —</text>
</svg>