<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zodiac Gallery — Stoic Wisdom</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Raleway:wght@300;400;600&family=Playfair+Display:ital@1&display=swap');

/* Token system */
:root {
  --bg: #0A0A0A;
  --surface: #111111;
  --surface-hover: #1A1A1A;
  --text: #F5F5F5;
  --text-muted: rgba(245,245,245,0.4);
  --gold: #D4AF37;
  --gold-dim: rgba(212,175,55,0.15);
  --border: rgba(212,175,55,0.1);
  --card-radius: 8px;
}

:root[data-theme="light"] {
  --bg: #F5F0EB;
  --surface: #FFFFFF;
  --surface-hover: #FAFAFA;
  --text: #1A1A1A;
  --text-muted: rgba(26,26,26,0.4);
  --gold: #B8962E;
  --gold-dim: rgba(184,150,46,0.08);
  --border: rgba(184,150,46,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Raleway', Helvetica, Arial, sans-serif; min-height: 100vh; }

/* Header */
header {
  text-align: center;
  padding: 48px 24px 24px;
  border-bottom: 1px solid var(--border);
}
h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.4rem; font-weight: 700; color: var(--gold); letter-spacing: 0.04em; }
.sub { font-size: 0.85rem; font-weight: 300; color: var(--text-muted); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 6px; }
.stats { display: flex; justify-content: center; gap: 32px; margin-top: 12px; font-size: 0.8rem; color: var(--text-muted); }
.stats span { display: flex; align-items: center; gap: 4px; }
.stats em { font-style: normal; color: var(--gold); font-weight: 600; }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  max-width: 1400px;
  margin: 32px auto;
  padding: 0 24px 64px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  background: var(--bg);
}

.card-body {
  padding: 14px 18px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-body .info { flex: 1; }
.card-body .symbol { font-size: 1.6rem; line-height: 1; margin-right: 8px; }
.card-body h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 600; color: var(--gold); }
.card-body .dates { font-size: 0.7rem; font-weight: 300; color: var(--text-muted); letter-spacing: 0.08em; }
.card-body .prompt { font-size: 0.7rem; color: var(--text-muted); max-width: 200px; text-align: right; line-height: 1.3; }

@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; padding: 0 16px 48px; gap: 16px; }
  h1 { font-size: 1.8rem; }
  .stats { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<div class="grid" id="gallery"></div>

</body>
</html>
