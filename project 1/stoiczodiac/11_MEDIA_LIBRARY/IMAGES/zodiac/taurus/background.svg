<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgTaurus" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A1816"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowTaurus" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2A9D8F" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#2A9D8F" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#2A9D8F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineTaurus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A9D8F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2A9D8F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2A9D8F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgTaurus)"/>
  <rect width="1080" height="1080" fill="url(#glowTaurus)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineTaurus)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineTaurus)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Taurus symbol (Bull) -->
  <g transform="translate(540,460)" fill="none" stroke="#D4AF37" stroke-width="3">
    <!-- Bull head and horns -->
    <circle cx="0" cy="-10" r="60" stroke-width="2.5"/>
    <path d="M-60,-30 C-80,-80 -40,-90 -20,-50" stroke-linecap="round"/>
    <path d="M60,-30 C80,-80 40,-90 20,-50" stroke-linecap="round"/>
    <!-- Bull face features -->
    <circle cx="-20" cy="-20" r="4" fill="#2A9D8F" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="-20" r="4" fill="#2A9D8F" stroke="none" opacity="0.5"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke-width="2" opacity="0.5"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#2A9D8F" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">TAURUS</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">APR 20 — MAY 20</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>