<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgAqua" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowAqua" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#00B4D8" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineAqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgAqua)"/>
  <rect width="1080" height="1080" fill="url(#glowAqua)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineAqua)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineAqua)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Aquarius symbol (Water Bearer / Waves) -->
  <g transform="translate(540,460)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Wave 1 -->
    <path d="M-100,20 C-60,-30 -20,70 20,20 C60,-30 100,30 100,30"/>
    <!-- Wave 2 -->
    <path d="M-100,50 C-60,0 -20,100 20,50 C60,0 100,60 100,60"/>
    <!-- Water drops flowing from above -->
    <path d="M-30,-80 C-30,-60 -20,-50 -20,-40" stroke-width="2"/>
    <path d="M0,-90 C0,-70 10,-60 10,-50" stroke-width="2"/>
    <path d="M30,-75 C30,-55 40,-45 40,-35" stroke-width="2"/>
    <!-- Drop accent dots -->
    <circle cx="-20" cy="-40" r="3" fill="#00B4D8" stroke="none" opacity="0.4"/>
    <circle cx="10" cy="-50" r="3" fill="#00B4D8" stroke="none" opacity="0.4"/>
    <circle cx="40" cy="-35" r="3" fill="#00B4D8" stroke="none" opacity="0.4"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#00B4D8" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">AQUARIUS</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">JAN 20 — FEB 18</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>