<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgVirgo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141009"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowVirgo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8D6E63" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#8D6E63" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8D6E63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineVirgo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8D6E63" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8D6E63" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8D6E63" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgVirgo)"/>
  <rect width="1080" height="1080" fill="url(#glowVirgo)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineVirgo)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineVirgo)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Virgo symbol (Maiden) -->
  <g transform="translate(540,470)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Maiden form - elegant curve -->
    <path d="M0,-90 C0,-90 5,-60 5,-30 C5,0 0,20 -10,40"/>
    <!-- Arm holding wheat -->
    <path d="M5,-40 C25,-45 40,-35 50,-20 C55,-15 60,-20 55,-30" stroke-width="2"/>
    <!-- Wheat stalks -->
    <line x1="50" y1="-20" x2="55" y2="-5" stroke-width="1.5"/>
    <line x1="52" y1="-18" x2="60" y2="-5" stroke-width="1.5"/>
    <line x1="48" y1="-22" x2="50" y2="-5" stroke-width="1.5"/>
    <!-- Wheat grain dots -->
    <circle cx="55" cy="-5" r="2" fill="#8D6E63" stroke="none" opacity="0.4"/>
    <circle cx="60" cy="-5" r="2" fill="#8D6E63" stroke="none" opacity="0.4"/>
    <circle cx="50" cy="-5" r="2" fill="#8D6E63" stroke="none" opacity="0.4"/>
    <!-- M - maiden stylized base -->
    <path d="M-15,40 C-15,50 0,50 0,40 C0,50 15,50 15,40"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#8D6E63" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">VIRGO</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">AUG 23 — SEP 22</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>