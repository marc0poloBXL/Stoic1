<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgScorpio" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#15081A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowScorpio" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6C3483" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#6C3483" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6C3483" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineScorpio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C3483" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6C3483" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6C3483" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgScorpio)"/>
  <rect width="1080" height="1080" fill="url(#glowScorpio)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineScorpio)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineScorpio)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Scorpio symbol (Scorpion) -->
  <g transform="translate(540,460)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Body/tail curve -->
    <path d="M40,30 C80,10 100,30 80,60 C60,90 30,70 40,40"/>
    <!-- Stinger -->
    <path d="M80,60 C90,70 85,85 75,85 C70,85 72,75 75,75"/>
    <line x1="75" y1="75" x2="80" y2="65" stroke-width="2"/>
    <!-- Body connecting to tail -->
    <path d="M40,40 C20,50 -20,50 -40,30" stroke-width="3.5"/>
    <!-- Claws -->
    <path d="M-40,30 C-70,20 -90,10 -95,20" stroke-width="2.5"/>
    <path d="M-40,30 C-70,40 -90,50 -95,40" stroke-width="2.5"/>
    <!-- Inner claw curves -->
    <path d="M-95,20 C-100,25 -95,30 -90,28" stroke-width="1.5"/>
    <path d="M-95,40 C-100,35 -95,30 -90,32" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="-20" cy="25" r="2" fill="#6C3483" stroke="none" opacity="0.6"/>
    <circle cx="-10" cy="25" r="2" fill="#6C3483" stroke="none" opacity="0.6"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#6C3483" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">SCORPIO</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">OCT 23 — NOV 21</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>