<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGemini" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A1709"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowGemini" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E9C46A" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#E9C46A" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#E9C46A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGemini" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9C46A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E9C46A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E9C46A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgGemini)"/>
  <rect width="1080" height="1080" fill="url(#glowGemini)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineGemini)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineGemini)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Gemini symbol (Twins/Duality) -->
  <g transform="translate(540,470)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Two pillars - the dual nature -->
    <line x1="-30" y1="-80" x2="-30" y2="40"/>
    <line x1="30" y1="-80" x2="30" y2="40"/>
    <!-- Connection arc at top -->
    <path d="M-30,-80 C-60,-90 60,-90 30,-80"/>
    <!-- Connection arc at bottom -->
    <path d="M-30,40 C-60,50 60,50 30,40"/>
    <!-- Middle crossbar -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke-width="2" opacity="0.6"/>
    <!-- Star accent -->
    <circle cx="-30" cy="-80" r="3" fill="#E9C46A" stroke="none" opacity="0.5"/>
    <circle cx="30" cy="-80" r="3" fill="#E9C46A" stroke="none" opacity="0.5"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#E9C46A" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">GEMINI</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">MAY 21 — JUN 20</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>