<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgCap" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A120E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowCap" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#1B4332" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B4332" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1B4332" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1B4332" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgCap)"/>
  <rect width="1080" height="1080" fill="url(#glowCap)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineCap)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineCap)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Capricorn symbol (Sea-Goat) -->
  <g transform="translate(540,460)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Goat head and beard -->
    <path d="M-40,-80 C-60,-100 -100,-60 -80,-30 C-70,-15 -50,-10 -40,-20"/>
    <!-- Horn -->
    <path d="M-40,-80 C-20,-120 10,-100 0,-70" stroke-width="2.5"/>
    <!-- Beard -->
    <path d="M-80,-30 C-90,-15 -85,5 -70,10"/>
    <!-- Body curve transitioning to fish tail -->
    <path d="M-40,-20 C20,-20 50,0 60,30 C70,60 60,80 40,90"/>
    <!-- Fish tail -->
    <path d="M40,90 C20,110 0,100 10,80 C20,70 30,80 25,90" stroke-width="2"/>
    <path d="M40,90 C60,110 80,100 70,80 C60,70 50,80 55,90" stroke-width="2"/>
    <!-- Scales on tail -->
    <path d="M50,60 C45,70 55,75 60,65" stroke-width="1.5" opacity="0.5"/>
    <path d="M55,50 C50,60 60,65 65,55" stroke-width="1.5" opacity="0.5"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#1B4332" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">CAPRICORN</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">DEC 22 — JAN 19</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>