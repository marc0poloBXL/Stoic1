<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgSag" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A0D1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowSag" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1D3557" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#1D3557" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1D3557" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineSag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D3557" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1D3557" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D3557" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgSag)"/>
  <rect width="1080" height="1080" fill="url(#glowSag)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineSag)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineSag)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Sagittarius symbol (Archer/Bow) -->
  <g transform="translate(540,460)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Bow -->
    <path d="M-80,-10 C-40,-90 40,-90 80,-10"/>
    <path d="M-80,10 C-40,90 40,90 80,10"/>
    <!-- Bowstring -->
    <line x1="-80" y1="-10" x2="-80" y2="10"/>
    <!-- Arrow -->
    <line x1="-80" y1="0" x2="60" y2="-50"/>
    <!-- Arrowhead -->
    <line x1="60" y1="-50" x2="72" y2="-42" stroke-width="2"/>
    <line x1="60" y1="-50" x2="68" y2="-58" stroke-width="2"/>
    <!-- Arrow fletching -->
    <line x1="-30" y1="-16" x2="-20" y2="-26" stroke-width="1.5"/>
    <line x1="-40" y1="-12" x2="-30" y2="-26" stroke-width="1.5"/>
    <!-- Draw point -->
    <circle cx="-60" cy="-20" r="2" fill="#D4AF37" stroke="none" opacity="0.4"/>
  </g>

  <!-- Stars -->
  <g fill="#D4AF37" opacity="0.15">
    <circle cx="150" cy="200" r="2"/>
    <circle cx="900" cy="300" r="1.5"/>
    <circle cx="200" cy="800" r="1.5"/>
    <circle cx="850" cy="750" r="2"/>
    <circle cx="300" cy="350" r="1"/>
    <circle cx="750" cy="250" r="1"/>
    <circle cx="350" cy="700" r="1.5"/>
    <circle cx="700" cy="850" r="1"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#1D3557" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">SAGITTARIUS</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">NOV 22 — DEC 21</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>