<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgLibra" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A121E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glowLibra" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#457B9D" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#457B9D" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#457B9D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineLibra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#457B9D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#457B9D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#457B9D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgLibra)"/>
  <rect width="1080" height="1080" fill="url(#glowLibra)"/>

  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.12"/>
  <circle cx="540" cy="540" r="460" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.08"/>

  <rect x="200" y="120" width="680" height="1" fill="url(#lineLibra)" opacity="0.4"/>
  <rect x="200" y="959" width="680" height="1" fill="url(#lineLibra)" opacity="0.4"/>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="160" x2="160" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="880" y2="160" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="160" x2="920" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="200" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="920" x2="160" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="880" y2="920" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>
  <line x1="920" y1="920" x2="920" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Libra symbol (Scales) -->
  <g transform="translate(540,460)" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <!-- Top crossbar -->
    <line x1="-100" y1="-60" x2="100" y2="-60"/>
    <!-- Center pivot -->
    <line x1="0" y1="-60" x2="0" y2="20"/>
    <!-- Left scale pan -->
    <path d="M-100,-60 C-120,-40 -110,-5 -90,0"/>
    <line x1="-90" y1="0" x2="-90" y2="15"/>
    <line x1="-105" y1="15" x2="-75" y2="15"/>
    <!-- Right scale pan -->
    <path d="M100,-60 C120,-40 110,-5 90,0"/>
    <line x1="90" y1="0" x2="90" y2="15"/>
    <line x1="75" y1="15" x2="105" y2="15"/>
    <!-- Balance indicator -->
    <polygon points="0,20 -8,35 8,35" fill="#D4AF37" stroke="none" opacity="0.3"/>
    <!-- Gold accent dots on pans -->
    <circle cx="-90" cy="-5" r="3" fill="#D4AF37" stroke="none" opacity="0.4"/>
    <circle cx="90" cy="-5" r="3" fill="#D4AF37" stroke="none" opacity="0.4"/>
  </g>

  <g opacity="0.06" fill="none" stroke="#457B9D" stroke-width="1">
    <path d="M0,540 L1080,540"/>
    <path d="M540,0 L540,1080"/>
  </g>

  <text x="540" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" fill="#D4AF37" text-anchor="middle" letter-spacing="8" opacity="0.8">LIBRA</text>
  <text x="540" y="860" font-family="'Raleway', Helvetica, sans-serif" font-size="16" fill="#F5F5F5" text-anchor="middle" letter-spacing="4" opacity="0.3">SEP 23 — OCT 22</text>

  <circle cx="540" cy="140" r="2" fill="#D4AF37" opacity="0.2"/>
  <circle cx="540" cy="940" r="2" fill="#D4AF37" opacity="0.2"/>
</svg>