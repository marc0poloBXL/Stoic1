<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="marble">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feBlend in="faded" in2="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" filter="url(#marble)"/>

  <!-- Full gold border - visible for carousel slides -->
  <rect x="20" y="20" width="1040" height="1040" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Inner border -->
  <rect x="30" y="30" width="1020" height="1020" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>

  <!-- Top header bar (for page title section) -->
  <rect x="100" y="45" width="880" height="1" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Bottom footer area line (for page numbers) -->
  <rect x="100" y="1034" width="880" height="1" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Corner ornaments -->
  <path d="M 36 46 L 36 36 L 46 36" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 1044 46 L 1044 36 L 1034 36" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 36 1034 L 36 1044 L 46 1044" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 1044 1034 L 1044 1044 L 1034 1044" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Page number placeholder circle - bottom center -->
  <text x="540" y="1060" font-family="Arial, sans-serif" font-size="12" fill="#C9A96E" text-anchor="middle" opacity="0.6">5 / 7</text>

  <!-- Content safe zone -->
  <text x="540" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="600"
        fill="#D4AF37" text-anchor="middle" letter-spacing="3" opacity="0.8">REFLECTION</text>

    <text x="540" y="160" font-family="Arial, sans-serif" font-size="64" fill="#A8DADC" text-anchor="middle" opacity="0.9">♋</text>
    <text x="540" y="210" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#A8DADC" text-anchor="middle" letter-spacing="3" opacity="0.8">Cancer</text>

    <line x1="300" y1="240" x2="780" y2="240" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

    <text x="540" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#C9A96E" text-anchor="middle" opacity="0.9">Reflection</text>

    <text x="540" y="360" font-family="Arial, sans-serif" font-size="18" fill="#F5F5F5" text-anchor="middle" opacity="0.85">Ask yourself: 'Did I let impulse rule, or did I pause
and choose?'</text>

    <text x="540" y="980" font-family="Arial, sans-serif" font-size="12" fill="#F5F5F5" text-anchor="middle" opacity="0.2" letter-spacing="2">@STOICZODIAC</text>
</svg>