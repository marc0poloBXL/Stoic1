  <text x="540" y="330" font-family="Raleway,sans-serif" font-size="17" letter-spacing="4" fill="#00B4D8" text-anchor="middle" opacity="0.8">MIND, CONNECTION, PERSPECTIVE</text>
  <text x="540" y="430" font-family="'Playfair Display',Georgia,serif" font-size="30" fill="#00B4D8" text-anchor="middle">♒ Aquarius</text>
<text x="540" y="478" font-family="Raleway,sans-serif" font-size="20" fill="#F5F5F5" text-anchor="middle" opacity="0.85">Your best ideas serve the common good.</text>
  <text x="540" y="630" font-family="'Playfair Display',Georgia,serif" font-size="30" fill="#00B4D8" text-anchor="middle">♊ Gemini</text>
<text x="540" y="678" font-family="Raleway,sans-serif" font-size="20" fill="#F5F5F5" text-anchor="middle" opacity="0.85">Stillness quiets the noise — sit with one</text>
  <text x="540" y="718" font-family="Raleway,sans-serif" font-size="20" fill="#F5F5F5" text-anchor="middle" opacity="0.85">thought today.</text>
