<text x="540" y="878" font-family="Raleway,sans-serif" font-size="20" fill="#F5F5F5" text-anchor="middle" opacity="0.85">Weigh what deserves a reply before you</text>
  <text x="540" y="918" font-family="Raleway,sans-serif" font-size="20" fill="#F5F5F5" text-anchor="middle" opacity="0.85">speak.</text>
